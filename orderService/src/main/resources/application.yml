server:
  port: 8081

spring:
  application:
    name: order-service
  data:
    mongodb:
      # En local : MongoDB exposé sur 27018 ; dans Docker Compose : mongodb:27017
      uri: ${MONGODB_URI:mongodb://localhost:27018/order_db}
      # Crée l'index unique uk_orderId s'il n'existe pas encore
      auto-index-creation: true
    redis:
      # En local : Redis exposé sur 6380 ; dans Docker Compose : redis:6379
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

# Délai entre deux lectures de la file shop:order:ready (millisecondes)
order:
  consumer:
    poll-delay-ms: 500
